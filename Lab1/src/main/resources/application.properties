server.port=8080

# PostgreSQL (кафедральный сервер: хост pg, БД studs). Логин/пароль — через переменные окружения.
spring.datasource.url=jdbc:postgresql://${DB_HOST:pg}:${DB_PORT:5432}/${DB_NAME:studs}
spring.datasource.username=${DB_USER:s000000}
spring.datasource.password=${DB_PASSWORD:changeme}

# Схема создаётся из schema.sql (ограничения на уровне БД), Hibernate её не меняет
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

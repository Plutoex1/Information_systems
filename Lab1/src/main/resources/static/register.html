<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Регистрация</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <form class="auth" id="form">
    <h2>Регистрация</h2>
    <ul class="errors" id="errors"></ul>
    <label>Логин<input name="username" required autofocus></label>
    <label>Пароль<input name="password" type="password" required></label>
    <button class="primary" type="submit">Зарегистрироваться</button>
    <p class="muted">Уже есть аккаунт? <a href="/login.html">Войти</a></p>
  </form>
  <script src="/js/common.js"></script>
  <script>
    document.getElementById('form').onsubmit = async (ev) => {
      ev.preventDefault();
      const e = ev.target.elements;
      try {
        await api('POST', '/api/auth/register', { username: e.username.value, password: e.password.value });
        location.href = '/login.html';
      } catch (err) {
        showErrors(document.getElementById('errors'), err.messages);
      }
    };
  </script>
</body>
</html>

<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Спецоперации</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav id="menu"></nav>
  <main>
    <h2>Специальные операции</h2>

    <section class="card">
      <h2>1. Десантник с минимальным значением weaponType</h2>
      <button id="btnMinWeapon">Выполнить</button>
      <div class="result" id="resMinWeapon"></div>
    </section>

    <section class="card">
      <h2>2. Десантник с максимальным id</h2>
      <button id="btnMaxId">Выполнить</button>
      <div class="result" id="resMaxId"></div>
    </section>

    <section class="card">
      <h2>3. Уникальные значения category</h2>
      <button id="btnCategories">Выполнить</button>
      <div class="result" id="resCategories"></div>
    </section>

    <section class="card">
      <h2>4. Добавить десантника в орден</h2>
      <form id="addForm" novalidate>
        <div id="addFields"></div>
        <button class="primary" type="submit">Добавить</button>
        <ul class="errors" id="addErrors"></ul>
      </form>
      <div class="result" id="resAdd"></div>
    </section>

    <section class="card">
      <h2>5. Распустить орден</h2>
      <form id="dissolveForm">
        <label>Распустить орден<select name="chapter" required></select></label>
        <label>Перевести десантников в орден<select name="target"></select></label>
        <button class="danger" type="submit">Распустить</button>
      </form>
      <div class="result" id="resDissolve"></div>
    </section>
  </main>

  <script src="/js/common.js"></script>
  <script src="/js/special.js"></script>
</body>
</html>

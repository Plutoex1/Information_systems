<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ордена</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav id="menu"></nav>
  <main>
    <div class="toolbar">
      <h2>Ордена космодесанта</h2>
      <span class="grow"></span>
      <button class="primary" id="btnCreate">Создать орден</button>
    </div>
    <div class="tablewrap">
      <table>
        <thead>
          <tr><th>ID</th><th>Название</th><th>Легион</th><th>Численность</th><th>Мир</th><th>Действия</th></tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </main>

  <dialog id="chapterDialog">
    <form id="chapterForm" novalidate>
      <h2 id="dlgTitle"></h2>
      <label>Название<input name="name" maxlength="255" required></label>
      <label>Родительский легион (необязательно)<input name="parentLegion" maxlength="255"></label>
      <label>Численность (1–1000)<input name="marinesCount" type="number" step="1" min="1" max="1000" required></label>
      <label>Мир<input name="world" maxlength="255" required></label>
      <ul class="errors" id="formErrors"></ul>
      <div class="buttons">
        <button type="button" id="btnCancel">Отмена</button>
        <button type="submit" class="primary">Сохранить</button>
      </div>
    </form>
  </dialog>

  <dialog id="membersDialog">
    <div id="membersBody"></div>
    <div class="buttons"><button id="membersClose">Закрыть</button></div>
  </dialog>

  <dialog id="dissolveDialog">
    <form id="dissolveForm">
      <h2 id="dissolveTitle"></h2>
      <p id="dissolveText"></p>
      <label id="targetLabel">Перевести десантников в орден
        <select name="target"></select>
      </label>
      <ul class="errors" id="dissolveErrors"></ul>
      <div class="buttons">
        <button type="button" id="dissolveCancel">Отмена</button>
        <button type="submit" class="danger" id="dissolveOk">Распустить</button>
      </div>
    </form>
  </dialog>

  <script src="/js/common.js"></script>
  <script src="/js/chapters.js"></script>
</body>
</html>
